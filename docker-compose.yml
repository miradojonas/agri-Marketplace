# ═══════════════════════════════════════════════
# Agri-Marketplace — Docker Compose
# ═══════════════════════════════════════════════
# Usage:
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed
#   docker compose down
# ═══════════════════════════════════════════════

services:
  # ── Application (PHP-FPM + Nginx + Queue) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "Agri-Marketplace"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-agri_marketplace}"
      DB_USERNAME: "${DB_USERNAME:-agri_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agri-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── MySQL 8 ──
  mysql:
    image: mysql:8.0
    container_name: agri-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      MYSQL_DATABASE: "${DB_DATABASE:-agri_marketplace}"
      MYSQL_USER: "${DB_USERNAME:-agri_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mysql-data:/var/lib/mysql
    # ports:  # ⚠️ Décommenter uniquement en développement
    #   - "${DB_EXTERNAL_PORT:-3307}:3306"
    networks:
      - agri-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: agri-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # ports:  # ⚠️ Décommenter uniquement en développement
    #   - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    networks:
      - agri-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local

networks:
  agri-net:
    driver: bridge
